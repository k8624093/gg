        const area = document.getElementById("blog-copy-area");

          const htmlContent = area.innerHTML;
          const textContent = area.innerText;
          const blobHtml = new Blob([htmlContent], { type: "text/html" });
          const blobText = new Blob([textContent], { type: "text/plain" });
          const data = [new ClipboardItem({ "text/html": blobHtml, "text/plain": blobText })];
          await navigator.clipboard.write(data);
          setCopyStatus("블로그 양식 복사 완료! (네이버 블로그 에디터에서 Ctrl+V 누르세요)");
          setTimeout(() => setCopyStatus(""), 4000);
        } catch (err) {
          navigator.clipboard.writeText(area.innerText);
          setCopyStatus("텍스트 복사 완료! (네이버 블로그에 붙여넣기 가능)");

                      <div>• <strong>주거 형태:</strong> {cfg.name} ({roomSize})</div>
                      <div>• <strong>출발지:</strong> {fromLocation} ({buildingName})</div>
                      <div>• <strong>도착지:</strong> {toLocation}</div>
                      <div>• <strong>작업 유형:</strong> {moveType} ({truckSize})</div>
                    </div>

                    {/* Dynamic Image Sections */}
                    {images.length === 0 ? (
                      <div className="p-6 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs md:text-sm">
                        💡 <strong>안내:</strong> 왼쪽에서 현장 사진을 올린 뒤 <strong>[{cfg.name} 사진 정밀 판독 & 맞춤 글 생성하기]</strong> 버튼을 눌러보세요. 사진 속 가구와 상황에 맞게 글이 자동 완성됩니다!
                      </div>
                    ) : (
                      <div className="space-y-8 my-6">
                        {images.map((img, idx) => (
                          <div key={img.id} className="space-y-2.5">
                            <h3 className="text-base md:text-lg font-bold text-slate-900 border-l-4 border-blue-600 pl-2.5">
                              {idx + 1}. {img.aiTitle}
                            </h3>
                            <p className="text-xs md:text-sm text-slate-700 leading-relaxed">
                              {img.aiAnalysis}
                            </p>
                            <div className="my-3 text-center">
                              <img
                                src={img.url}
                                alt={img.aiTitle}
                                className="max-w-full md:max-w-md mx-auto rounded-xl shadow-md border border-slate-200 object-cover"
                              />
                              <p className="text-[11px] text-slate-500 italic mt-1.5">
                                ▲ [{fromLocation.split(" ")[0]} {cfg.name}이사] {img.aiTitle}
                              </p>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* Blog Outro */}
                    <div className="bg-slate-50 border border-slate-200 p-4 md:p-5 rounded-xl space-y-2 text-xs md:text-sm">
                      <h4 className="font-bold text-slate-900">
                        ✨ 도착지 가구 세팅 및 피톤치드 살균 소독 마무리
                      </h4>
                      <p className="text-slate-700">
                        {blogOutro || `새 보금자리에 도착하여 고객님이 지정하신 위치에 가구를 반듯하게 수평 세팅하고 짐을 정돈해 드렸습니다. 바닥 고온 스팀 청소와 집안 전체 피톤치드 살균 소독으로 쾌적하게 마무리했습니다.`}
                      </p>
                    </div>

                    {/* Contact Box */}
                    <div className="p-5 rounded-xl bg-blue-50 border border-blue-200 text-slate-800 space-y-2">
                      <h4 className="font-black text-blue-900 text-sm md:text-base">
                        📞 {fromLocation.split(" ")[0]} {cfg.name}이사 무료 방문 견적 문의
                      </h4>
                      <div className="text-xs md:text-sm text-blue-800 space-y-1">
                        <div>• <strong>업체명:</strong> {companyName}</div>
                        <div>• <strong>직통 문의:</strong> {phone} / {localTel}</div>
                        <div>• <strong>카카오톡 상담:</strong> {kakao}</div>
                        <div>• <strong>출장 견적:</strong> {fromLocation.split(" ")[0]} 관내 및 전국 시외 장거리 이사 무료 출장 상담 환영!</div>
                      </div>
                    </div>

                    {/* Hashtags */}
                    <div className="text-[11px] text-slate-400 font-medium pt-2">
                      #{fromLocation.split(" ")[0]}이사 #{fromLocation.split(" ")[0]}{cfg.name === '아파트' ? '포장이사' : '원룸이사'} #{buildingName.replace(/\s+/g, '')} #{cfg.name}이사 #{toLocation.split(" ")[0]}이사 #이사잘하는곳 #포장이사후기
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: INSTA PREVIEW */}
              {activeTab === 'insta' && (
                <div className="space-y-5">
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 max-w-md mx-auto">
                    {/* Header */}
                    <div className="flex items-center gap-3 pb-3 border-b border-slate-100">
                      <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-pink-600 flex items-center justify-center text-white font-black text-sm">
                        🚚
                      </div>
                      <div>
                        <div className="font-bold text-xs md:text-sm text-slate-900">{companyName.replace(/\s+/g, '_')}</div>
                        <div className="text-[11px] text-slate-400">{fromLocation} ➔ {toLocation}</div>
                      </div>
                    </div>

                    {/* Carousel Card */}
                    <div className="mt-3 aspect-square bg-slate-900 rounded-xl overflow-hidden relative flex items-center justify-center">
                      {images.length > 0 ? (
                        <>
                          <img src={images[0].url} alt="" className="w-full h-full object-cover" />
                          <div className="absolute top-2.5 right-2.5 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">
                            1 / {images.length}
                          </div>
                          <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent p-4 text-white">
                            <span className="text-[10px] font-black uppercase tracking-wider text-pink-400">
                              {cfg.name} {moveType}
                            </span>
                            <h4 className="text-sm md:text-base font-extrabold mt-0.5">
                              {fromLocation.split(" ")[1] || fromLocation} ➔ {toLocation.split(" ")[1] || toLocation}
                            </h4>
                            <p className="text-[11px] text-slate-200 mt-1 line-clamp-2">
                              {images[0].aiAnalysis}
                            </p>
                          </div>
                        </>
                      ) : (
                        <div className="text-center text-slate-400 p-6">
                          <p className="text-3xl mb-1">📷</p>
                          <p className="text-xs font-semibold">사진을 등록하고 AI 분석을 누르면 카드뉴스가 자동 구성됩니다.</p>
                        </div>
                      )}
                    </div>

                    {/* Caption Preview */}
                    <div className="mt-3.5 pt-3 border-t border-slate-100">
                      <div className="flex items-center justify-between mb-1.5">
                        <span className="text-xs font-bold text-slate-700">인스타그램 캡션 전문</span>
                        <button
                          onClick={copyInstaToClipboard}
                          className="text-xs text-pink-600 font-bold hover:underline"
                        >
                          캡션 복사
                        </button>
                      </div>
                      <pre className="bg-slate-50 p-3 rounded-xl text-[11px] text-slate-700 whitespace-pre-wrap font-sans max-h-48 overflow-y-auto custom-scroll border border-slate-200">
                        {instaCaption || "AI 사진 분석을 실행하면 인스타그램 캡션이 완성됩니다."}
                      </pre>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
