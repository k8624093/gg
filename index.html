    // 1. Error Boundary (흰 화면 방지 안전 가드)
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Error caught by boundary:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100">
              <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full text-center space-y-4 border border-rose-200">
                <div className="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-3xl">
                  ⚠️
                </div>
                <h2 className="text-xl font-bold text-slate-900">화면 표시 중 일시적인 오류가 발생했습니다</h2>
                <p className="text-xs text-slate-600 leading-relaxed font-mono bg-slate-50 p-3 rounded-lg border border-slate-200 text-left overflow-auto max-h-32">
                  {this.state.error?.toString()}
                </p>
                <button
                  onClick={() => {
                    this.setState({ hasError: false });
                    window.location.reload();
                  }}
                  className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition shadow"
                >
                  새로고침하여 복구하기
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // 2. Safe LocalStorage
    const safeStorage = {
      get: (key, fallback = "") => {
        try {
          return localStorage.getItem(key) || fallback;
        } catch (e) {
          console.warn("LocalStorage 접근 제한:", e);
          return fallback;
        }
      },
      set: (key, val) => {
        try {
          localStorage.setItem(key, val);
          return true;
        } catch (e) {
          console.warn("LocalStorage 저장 제한:", e);
          return false;
        }
      }
    };

    // 4. Ultra-Fast Image Compression (createImageBitmap + Canvas)
    const compressImage = async (file) => {
      if (!file) return { base64Data: "", mimeType: "image/jpeg" };

      if (typeof createImageBitmap === "function") {
        try {
          const bmp = await createImageBitmap(file);
          const maxDim = 800;
          let width = bmp.width;
          let height = bmp.height;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(bmp, 0, 0, width, height);
          bmp.close();
          const dataUrl = canvas.toDataURL("image/jpeg", 0.70);
          const base64Data = dataUrl.split(",")[1];
          if (base64Data && base64Data.length > 50) {
            return { base64Data, mimeType: "image/jpeg" };
          }
        } catch (e) {
          console.warn("createImageBitmap failed, using fallback:", e);
        }
      }

      return new Promise((resolve) => {
        const timer = setTimeout(() => {
          resolve({ base64Data: "", mimeType: "image/jpeg" });
        }, 4000);

        try {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              clearTimeout(timer);
              try {
                const maxDim = 800;
                let width = img.width;
                let height = img.height;
                if (width > maxDim || height > maxDim) {
                  if (width > height) {
                    height = Math.round((height * maxDim) / width);
                    width = maxDim;
                  } else {
                    width = Math.round((width * maxDim) / height);
                    height = maxDim;
                  }
                }
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                const dataUrl = canvas.toDataURL("image/jpeg", 0.70);
                const base64Data = dataUrl.split(",")[1];
                resolve({ base64Data, mimeType: "image/jpeg" });
              } catch (err) {
                resolve({ base64Data: "", mimeType: "image/jpeg" });
              }
            };
            img.onerror = () => {
              clearTimeout(timer);
              resolve({ base64Data: "", mimeType: "image/jpeg" });
            };
            img.src = event.target.result;
          };
          reader.onerror = () => {
            clearTimeout(timer);
            resolve({ base64Data: "", mimeType: "image/jpeg" });
          };
          reader.readAsDataURL(file);
        } catch (err) {
          clearTimeout(timer);
          resolve({ base64Data: "", mimeType: "image/jpeg" });
        }
      });
    };

                    <div className="p-5 rounded-xl bg-blue-50 border border-blue-200 text-slate-800 space-y-2">
                      <h4 className="font-black text-blue-900 text-sm md:text-base">
                        📞 {cityPrefix} {moveType} 무료 방문 견적 문의
                      </h4>
                      <div className="text-xs md:text-sm text-blue-800 space-y-1">
                        <div>• <strong>업체명:</strong> {companyName}</div>
                        <div>• <strong>직통 문의:</strong> {phone} / {localTel}</div>
                        <div>• <strong>카카오톡 상담:</strong> {kakao}</div>
                        <div>• <strong>출장 견적:</strong> {cityPrefix} 관내 및 전국 시외 장거리 이사 무료 출장 상담 환영!</div>
                      </div>
                    </div>

                    <div className="text-[11px] text-slate-400 font-medium pt-2">
                      {(moveCfg?.hashtags || []).join(" ")} #{cityPrefix}이사 #{String(buildingName || "").replace(/\s+/g, '')} #{cfg?.name || "아파트"}이사 #이사잘하는곳
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: INSTA PREVIEW */}
              {activeTab === 'insta' && (
                <div className="space-y-5">
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 max-w-md mx-auto">
                    <div className="flex items-center gap-3 pb-3 border-b border-slate-100">
                      <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-pink-600 flex items-center justify-center text-white font-black text-sm">
                        🚚
                      </div>
                      <div>
                        <div className="font-bold text-xs md:text-sm text-slate-900">{String(companyName || "").replace(/\s+/g, '_')}</div>
                        <div className="text-[11px] text-slate-400">{fromLocation} ➔ {toLocation}</div>
                      </div>
                    </div>

                    <div className="mt-3 aspect-square bg-slate-900 rounded-xl overflow-hidden relative flex items-center justify-center">
                      {images.length > 0 ? (
                        <>
                          {images[0].url ? (
                            <img src={images[0].url} alt="" className="w-full h-full object-cover" />
                          ) : (
                            <div className="text-slate-400">사진 미리보기</div>
                          )}
                          <div className="absolute top-2.5 right-2.5 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">
                            1 / {images.length}
                          </div>
                          <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent p-4 text-white">
                            <span className="text-[10px] font-black uppercase tracking-wider text-pink-400">
                              {moveType} 현장 실황
                            </span>
                            <h4 className="text-sm md:text-base font-extrabold mt-0.5">
                              {fromLocSecond} ➔ {toLocSecond}
                            </h4>
                            <p className="text-[11px] text-slate-200 mt-1 line-clamp-2">
                              {images[0].aiAnalysis}
                            </p>
                          </div>
                        </>
                      ) : (
                        <div className="text-center text-slate-400 p-6">
                          <p className="text-3xl mb-1">📷</p>
                          <p className="text-xs font-semibold">사진을 등록하고 생성 버튼을 누르면 카드뉴스가 자동 구성됩니다.</p>
                        </div>
                      )}
                    </div>

                    <div className="mt-3.5 pt-3 border-t border-slate-100">
                      <div className="flex items-center justify-between mb-1.5">
                        <span className="text-xs font-bold text-slate-700">인스타그램 캡션 전문</span>
                        <button
                          type="button"
                          onClick={copyInstaToClipboard}
                          className="text-xs text-pink-600 font-bold hover:underline"
                        >
                          캡션 복사
                        </button>
                      </div>
                      <pre className="bg-slate-50 p-3 rounded-xl text-[11px] text-slate-700 whitespace-pre-wrap font-sans max-h-48 overflow-y-auto custom-scroll border border-slate-200">
                        {instaCaption || "글 생성 버튼을 누르면 인스타그램 캡션이 완성됩니다."}
                      </pre>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
